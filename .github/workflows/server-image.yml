name: Test and publish router server

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'openclaw_router/**'
      - 'tests/test_openclaw_http_tool_calls.py'
      - 'tests/test_openclaw_session_routing.py'
      - 'tests/control_center/**'
      - 'control_center_ui/**'
      - 'requirements-server.txt'
      - 'Dockerfile.server'
      - '.dockerignore'
      - 'pyproject.toml'
      - '.github/workflows/server-image.yml'
  pull_request:
    paths:
      - 'openclaw_router/**'
      - 'tests/test_openclaw_http_tool_calls.py'
      - 'tests/test_openclaw_session_routing.py'
      - 'tests/control_center/**'
      - 'control_center_ui/**'
      - 'requirements-server.txt'
      - 'Dockerfile.server'
      - '.dockerignore'
      - 'pyproject.toml'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-server.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: control_center_ui/package-lock.json
      - name: Build Control Center dashboard
        working-directory: control_center_ui
        run: npm ci --ignore-scripts && npm test && npm run build
      - name: Install server test dependencies
        run: |
          pip install -r requirements-server.txt pytest
          pip install --no-deps .
      - name: Compile server package
        run: python -m compileall -q openclaw_router
      - name: Run server tests
        run: >-
          pytest -q
          tests/test_openclaw_http_tool_calls.py
          tests/test_openclaw_session_routing.py
          tests/control_center

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64
          push: true
          build-args: |
            LLMROUTER_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/caprol55555/llmrouter:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
